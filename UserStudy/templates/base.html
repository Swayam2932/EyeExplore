<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}EyeExplore User Study{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('user_study.static', filename='study.css') }}">
    <script defer src="{{ url_for('user_study.static', filename='study.js') }}"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="EyeExplore home">
        <span class="brand-mark">◉</span><span>EyeExplore</span>
      </a>
      <span class="study-label">Participant Study</span>
    </header>
    {% if study_timer_deadline_ms %}
    <div class="study-timer" data-deadline-ms="{{ study_timer_deadline_ms }}" role="timer" aria-live="off">
      <span class="timer-label">Time remaining</span>
      <strong id="study-timer-display">{{ study_duration_minutes }}:00</strong>
      <span id="study-timer-message" class="timer-message" hidden>The 25-minute study time is up. Finish the current item and notify the study leader.</span>
    </div>
    {% endif %}
    <main class="page-wrap">
      {% block content %}{% endblock %}
    </main>
    <footer class="footer">EyeExplore · User Study</footer>
  </body>
</html>
